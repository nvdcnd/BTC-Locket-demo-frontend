<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Khung 9 ảnh — film</title>
    <style>html, body { margin: 0; padding: 0; background: #000; height: 100%; }</style>
</head>
<body>
    <!-- Grid 3x3 trong viền film trắng -->
    <div class="frame" style="position: relative; width: 100%; height: 100%; background-color: #000000;">

        <!-- 9 ô ảnh 3x3 -->
        <div class="fs" data-slot="0" style="position: absolute; left: 7%; top: 6%; width: 27.5%; height: 27.9%; overflow: hidden;"></div>
        <div class="fs" data-slot="1" style="position: absolute; left: 36.25%; top: 6%; width: 27.5%; height: 27.9%; overflow: hidden;"></div>
        <div class="fs" data-slot="2" style="position: absolute; left: 65.5%; top: 6%; width: 27.5%; height: 27.9%; overflow: hidden;"></div>
        <div class="fs" data-slot="3" style="position: absolute; left: 7%; top: 36.05%; width: 27.5%; height: 27.9%; overflow: hidden;"></div>
        <div class="fs" data-slot="4" style="position: absolute; left: 36.25%; top: 36.05%; width: 27.5%; height: 27.9%; overflow: hidden;"></div>
        <div class="fs" data-slot="5" style="position: absolute; left: 65.5%; top: 36.05%; width: 27.5%; height: 27.9%; overflow: hidden;"></div>
        <div class="fs" data-slot="6" style="position: absolute; left: 7%; top: 66.1%; width: 27.5%; height: 27.9%; overflow: hidden;"></div>
        <div class="fs" data-slot="7" style="position: absolute; left: 36.25%; top: 66.1%; width: 27.5%; height: 27.9%; overflow: hidden;"></div>
        <div class="fs" data-slot="8" style="position: absolute; left: 65.5%; top: 66.1%; width: 27.5%; height: 27.9%; overflow: hidden;"></div>

        <!-- Viền trắng đậm bao ngoài -->
        <div class="deco" data-type="rect" style="position: absolute; left: 5.5%; top: 4.5%; width: 89%; height: 91%;"
             data-stroke="#f5f5f5" data-stroke-width="6" data-radius="18"></div>

        <!-- 2 đường ngang ngăn hàng -->
        <div class="deco" data-type="rect" style="position: absolute; left: 5.5%; top: 33.9%; width: 89%; height: 0.6%;"
             data-fill="#f5f5f5"></div>
        <div class="deco" data-type="rect" style="position: absolute; left: 5.5%; top: 65.95%; width: 89%; height: 0.6%;"
             data-fill="#f5f5f5"></div>

        <!-- 2 đường dọc ngăn cột -->
        <div class="deco" data-type="rect" style="position: absolute; left: 34.85%; top: 4.5%; width: 0.6%; height: 91%;"
             data-fill="#f5f5f5"></div>
        <div class="deco" data-type="rect" style="position: absolute; left: 64.55%; top: 4.5%; width: 0.6%; height: 91%;"
             data-fill="#f5f5f5"></div>

        <!-- Chữ script cạnh khung trái -->
        <div class="deco" data-type="text" style="position: absolute; left: 1%; top: 44%; width: 3%; height: 12%;"
             data-text="Locket Cam" data-font="'Brush Script MT', 'Segoe Script', cursive" data-size="34"
             data-color="#f5f5f5" data-align="center" data-rotate="-90" data-italic="true"></div>

        <!-- Lỗ film cạnh trái -->
        <div class="deco" data-type="holes" style="position: absolute; left: 1.2%; top: 0%; width: 2.2%; height: 100%;"
             data-side="left" data-count="9" data-hole="12" data-gap="62" data-color="#f5f5f5"></div>

        <!-- Lỗ film cạnh phải -->
        <div class="deco" data-type="holes" style="position: absolute; left: 96.6%; top: 0%; width: 2.2%; height: 100%;"
             data-side="left" data-count="9" data-hole="12" data-gap="62" data-color="#f5f5f5"></div>

        <!-- Ngày ở chân khung -->
        <div class="deco" data-type="text" style="position: absolute; left: 10%; top: 94.8%; width: 80%; height: 4%;"
             data-text="{{date}}" data-font="'Courier New', monospace" data-size="22"
             data-color="#f5f5f5" data-align="center" data-spacing="4"></div>
    </div>
</body>
</html>
