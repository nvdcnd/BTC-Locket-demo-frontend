<!DOCTYPE html>
<html lang="vi">

    <title>Khung 4 ảnh</title>

</head>
<body>
    <!-- Grid 2x2 -->
    <div class="frame" style="position: relative; width: 100%; height: 100%; background: #000000;">
        <div class="fs" data-slot="0" style="position: absolute; left: 0%; top: 0%; width: 50%; height: 50%; overflow: hidden;"></div>
        <div class="fs" data-slot="1" style="position: absolute; left: 50%; top: 0%; width: 50%; height: 50%; overflow: hidden;"></div>
        <div class="fs" data-slot="2" style="position: absolute; left: 0%; top: 50%; width: 50%; height: 50%; overflow: hidden;"></div>
        <div class="fs" data-slot="3" style="position: absolute; left: 50%; top: 50%; width: 50%; height: 50%; overflow: hidden;"></div>
    </div>
</body>
</html>
