<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locket Web App</title>
    <!-- Bootstrap CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./css/main.css">
</head>
<body>

    <!-- Input file ẩn -->
    <input type="file" id="file-input" accept="image/*" style="display: none;">

    <!-- Toast notification -->
    <div id="toast-popover" class="toast-notification">
        <i id="toast-icon" class="bi bi-check-circle-fill text-warning fs-5"></i>
        <span id="toast-message">Đăng ảnh thành công!</span>
    </div>

    <!-- Topbar -->
    <header class="topbar">
        <div class="topbar-content">
            <div class="topbar-left">
                <div class="btn-glass-circle glass-panel" id="user-profile-btn" title="Tên của bạn">
                    <i class="bi bi-person-fill"></i>
                </div>
                <span id="user-name-display" class="user-name-display"></span>
            </div>
            <div class="topbar-center">
                <div class="sidebar-link active">
                    <p id="Datetime"></p>
                </div>
            </div>
            <div class="topbar-right">
                <div class="btn-glass-circle glass-panel">
                    <i class="bi bi-lightning-fill text-warning"></i>
                </div>
            </div>
        </div>
    </header>

    <!-- Sidebar Desktop -->
    <aside class="desktop-sidebar">
        <ul class="sidebar-menu">
            <li><a href="#" class="sidebar-link active"><i class="bi bi-camera-fill"></i> Locket</a></li>
            <li><a href="#" class="sidebar-link"><i class="bi bi-chat-fill"></i> BTC Fanpage</a></li>
        </ul>
    </aside>

    <!-- Main Container -->
    <div class="app-layout">
        <div class="desktop-container">

            <!-- Desktop Camera Column -->
            <div class="left-column d-none d-lg-flex">
                <div class="camera-container-box">
                    <div class="camera-frame position-relative" id="desktop-cam-frame">
                        <video id="webcam-desktop" class="camera-video" autoplay playsinline muted></video>
                        <button id="desktop-cam-toggle" class="btn-glass-circle glass-panel position-absolute top-0 end-0 m-3 border-0" title="Tắt/Mở Camera">
                            <i class="bi bi-camera-video-fill text-warning"></i>
                        </button>
                    </div>

                    <div class="preview-canvas-wrapper d-none" id="desktop-preview-frame">
                        <canvas id="desktop-canvas" class="preview-canvas"></canvas>
                        <input type="text" class="preview-caption-input" placeholder="Viết dòng trạng thái..." id="desktop-caption-input">
                    </div>

                    <div class="camera-actions">
                        <div class="btn-glass-circle glass-panel upload-btn-trigger"><i class="bi bi-images"></i></div>
                        <button class="btn-shutter shutter-trigger" id="desktop-shutter-btn"></button>
                        <div class="btn-glass-circle glass-panel export-btn-trigger d-none" id="desktop-export-btn" title="Xuất hình theo khung"></div>
                        <div class="btn-glass-circle glass-panel action-cancel-btn" id="desktop-cancel-btn"><i class="bi bi-arrow-repeat"></i></div>
                    </div>
                </div>
            </div>
            
            <!-- Feed Column -->
            <div class="right-column">
                <main class="view-feed" id="main-feed">

                    <!-- Mobile Camera Card 0 -->
                    <section class="card-item d-lg-none" id="camera-card">
                        <div class="camera-container-box">
                            <div class="camera-frame" id="mobile-cam-frame">
                                <video id="webcam-mobile" class="camera-video" autoplay playsinline muted></video>
                            </div>

                            <div class="preview-canvas-wrapper d-none" id="mobile-preview-frame">
                                <canvas id="mobile-canvas" class="preview-canvas"></canvas>
                                <input type="text" class="preview-caption-input" placeholder="Viết dòng trạng thái..." id="mobile-caption-input">
                            </div>

                            <div class="camera-actions">
                                <div class="btn-glass-circle glass-panel upload-btn-trigger"><i class="bi bi-images"></i></div>
                                <button class="btn-shutter shutter-trigger" id="mobile-shutter-btn"></button>
                                <div class="btn-glass-circle glass-panel export-btn-trigger d-none" id="mobile-export-btn" title="Xuất hình theo khung"></div>
                                <div class="btn-glass-circle glass-panel action-cancel-btn" id="mobile-cancel-btn"><i class="bi bi-arrow-repeat"></i></div>
                            </div>
                        </div>
                    </section>

                    <!-- CONTAINER CHỨA FEED POSTS (render bằng JS từ GET /images/) -->
                    <div id="feed-list"></div>

                    <!-- CARD END -->
                    <section class="card-item" id="end-card">
                        <div class="end-card-box glass-panel">
                            <i class="bi bi-check2-circle text-warning display-3 mb-3"></i>
                            <h5 class="fw-bold mb-2">Mọi thứ đã xong!</h5>
                            <p class="text-secondary fs-6 mb-0">M đã bắt kịp tất cả khoảnh khắc mới nhất của bạn bè rồi đó ✨</p>
                        </div>
                    </section>

                </main>
            </div>

        </div>
    </div>

    <!-- FAB BUTTON BẤM MỞ BOTTOM NAVBAR -->
    <div class="mobile-fab-btn glass-panel" id="fab-nav-trigger" title="Menu">
        <i class="bi bi-grid-fill"></i>
    </div>

    <!-- Bottom Nav (Mobile) -->
    <div class="mobile-navbar">
        <div class="navbar-body glass-panel" id="bottom-nav">
            <ul class="navbar-items">
                <li><i class="bi bi-grid-fill"></i></li>
                <li><i class="bi bi-camera-fill text-warning" id="nav-camera-btn"></i></li>
                <li><i class="bi bi-chat-fill"></i></li>
            </ul>
        </div>
    </div>

    <!-- Modal nhập tên user (localStorage) -->
    <div class="modal-overlay d-none" id="name-modal-overlay">
        <div class="modal-panel glass-panel name-modal-panel">
            <div class="modal-header">
                <h5><i class="bi bi-person-badge text-warning"></i> Tên của bạn</h5>
            </div>
            <p class="modal-hint">Tên này sẽ hiển thị dưới mỗi khoảnh khắc bạn đăng</p>
            <input type="text" class="name-modal-input" id="name-modal-input" placeholder="Nhập tên..." maxlength="50">
            <button class="name-modal-save-btn" id="name-modal-save" type="button">Lưu tên</button>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- App State & JS Logic -->
    <script src="./js/datetime.js"></script>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
